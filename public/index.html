<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Job board — find your next opportunity</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #162033; background: #f6f8fc; }
      * { box-sizing: border-box; }
      body { margin: 0 auto; max-width: 1040px; padding: 36px 20px; }
      h1 { margin: 0; font-size: 2rem; }
      h2 { margin-top: 0; font-size: 1.2rem; }
      p { color: #536176; }
      .layout { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(250px, 1fr); gap: 22px; align-items: start; margin-top: 24px; }
      section { background: white; border: 1px solid #e1e5ed; padding: 22px; border-radius: 14px; }
      ul { padding: 0; margin: 16px 0 0; }
      li { list-style: none; border: 1px solid #e1e5ed; border-radius: 10px; margin-bottom: 10px; padding: 14px; display: flex; gap: 12px; justify-content: space-between; align-items: center; }
      .job-title { font-weight: 650; }
      .job-meta { color: #536176; font-size: .88rem; margin-top: 5px; line-height: 1.5; }
      input { width: 100%; font: inherit; border: 1px solid #b5bfd1; border-radius: 8px; padding: 11px; }
      button { font: inherit; font-size: .9rem; background: #2459bb; color: white; border: 0; border-radius: 7px; cursor: pointer; padding: 8px 12px; white-space: nowrap; }
      button:hover:not(:disabled) { background: #17469c; }
      button:disabled { cursor: default; color: #52627b; background: #e6eaf2; }
      button.remove { background: #fff0f0; color: #a52222; }
      button.remove:hover { background: #ffdfdf; }
      .count { font-size: .85rem; color: #52627b; font-weight: 400; }
      .empty { padding: 12px 0; }
      #message { min-height: 1.5em; color: #a52222; }
      @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } body { padding: 22px 14px; } }
    </style>
  </head>
  <body>
    <header>
      <h1>Find your next opportunity</h1>
      <p>Explore internships and save the roles you want to revisit.</p>
    </header>
    <div class="layout">
      <section aria-labelledby="available-title">
        <h2 id="available-title">Available jobs</h2>
        <label for="search">Search jobs</label>
        <input id="search" type="search" placeholder="Title, company or location" />
        <ul id="jobs" aria-live="polite"></ul>
      </section>
      <section aria-labelledby="saved-title">
        <h2 id="saved-title">Saved jobs <span id="saved-count" class="count"></span></h2>
        <p>Keep track of roles that interest you.</p>
        <ul id="saved-jobs" aria-live="polite"></ul>
      </section>
    </div>
    <p id="message" role="alert"></p>
    <script type="module" src="/app.js"></script>
  </body>
</html>
